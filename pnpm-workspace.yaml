packages:
  - 'packages/*'
  - 'starter'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  # Permits the lib's postinstall (sync-rules.mjs) to run on consumer install.
  '@gravitysupport/astro-lib': true
minimumReleaseAgeExclude:
  - astro@6.3.7
  - '@netlify/edge-functions@3.0.8'
  - '@netlify/types@2.8.0'
