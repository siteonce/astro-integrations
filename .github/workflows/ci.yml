name: CI

# Lean backstop for what reaches `main`. The local pre-commit (lint-staged) is
# the primary gate; this re-verifies the *whole* tree non-mutatively and adds
# the checks lint-staged can't scope per file (typecheck, build).
on:
  push:
    branches: [main]
  # Forward-note (Phase 10): when the repo moves to PR-only from a designated
  # branch, swap this trigger to `pull_request`. The steps below stay as-is.

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so `cache: pnpm` can find it. Version comes from
      # the root package.json `packageManager` field — no need to pin it here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Verify variants only — never the `--write` `check`. CI must *fail* on a
      # formatting/lint miss, not silently rewrite it.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
