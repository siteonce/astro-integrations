name: CI

# Lean backstop for what reaches `main`. The local pre-commit (lint-staged) is
# the primary gate; this re-verifies the *whole* tree non-mutatively and adds
# the checks lint-staged can't scope per file (typecheck, package tests, the
# demo build, and the pack-and-install smoke test).
#
# `release` runs only after `verify` succeeds. With pending changesets it opens
# or updates the "Version Packages" pull request. With none, `pnpm release`
# builds `@siteonce/astro-intl` and publishes it. `changeset publish` calls
# `pnpm publish`, which exchanges this job's OIDC token for a short-lived npm
# token. There is no `NPM_TOKEN`. Provenance is attached when the repository
# is public.
#
# Third-party actions are pinned to a commit SHA, with the release tag in a
# trailing comment, because `release` can publish and push. A moved tag can't
# change what runs.
on:
  push:
    branches: [main]

# Concurrency is on each job, not the workflow. A workflow-level
# `cancel-in-progress: true` would cancel `release` when a newer push arrives,
# including a publish that has already started.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A newer push to the same ref supersedes an in-flight verify.
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node so `cache: pnpm` can find it. Version comes from
      # the root package.json `packageManager` field — no need to pin it here.
      # Exact tag: v6.1.0 is the first release that runs pnpm 12, and the
      # floating `v6` tag still points at v6.0.10.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Verify variants only — never the `--write` `check`. CI must *fail* on a
      # formatting/lint miss, not silently rewrite it.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  release:
    needs: verify
    # Off until the repository variable RELEASE_ENABLED is `true`. Until then
    # nothing publishes and no Version Packages pull request opens.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Publish and the Version Packages pull request run to completion. A newer
    # push waits in this group instead of cancelling the in-flight job.
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node so `cache: pnpm` can find it. Version comes from
      # the root package.json `packageManager` field — no need to pin it here.
      # Exact tag: v6.1.0 is the first release that runs pnpm 12, and the
      # floating `v6` tag still points at v6.0.10.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No `registry-url`. That writes an `.npmrc` auth token and would take
      # precedence over the OIDC exchange `pnpm publish` performs itself.
      # Node 22's bundled npm is unused: pnpm 12 publishes without it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
